//
// @package: AiBo
// @version: 4.8
// @author: AiBo Team
// @filename: AiBo.cfg
// 
// Main configuration file for AiBo. Can be executed using the 'exec' command.
//
//
// Autostart analyzer if all other cases fail.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_graph_analyze_auto_start "1"

//
// Auto save results of analysis to graph file and re-add bots.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_graph_analyze_auto_save "1"

//
// The minimum distance to keep nodes from each other.
// ---
// Default: "64", Min: "42", Max: "128"
// 
aibo_graph_analyze_distance "64"

//
// Max jump height to test if the next node will be unreachable.
// ---
// Default: "44", Min: "44", Max: "64"
// 
aibo_graph_analyze_max_jump_height "44"

//
// Max milliseconds of analysis work per server frame. Bounds analysis hitch, prevents hard freezes.
// ---
// Default: "4.0", Min: "1.0", Max: "25.0"
// 
aibo_graph_analyze_slice_ms "4.0"

//
// Finish steps as bitmask (1 optimize, 2 clean, 4 goals, 8 camps, 16 teams) or names (optimize,clean,goals,camps,teams,all,none).
// Teams step marks defenders around objectives and sparse attacker routes, per map type.
// ---
// Default: "all"
// 
aibo_graph_analyze_on_finish "all"

//
// Enables or disables useful messages about bot states. Not required for end users.
// ---
// Default: "0", Min: "0", Max: "4"
// 
aibo_debug "0"

//
// Forces all alive bots to build a path and go to the graph node specified here.
// ---
// Default: "-1", Min: "-1", Max: "4096"
// 
aibo_debug_goal "-1"

//
// Specifies the percent of bots that can follow a leader at each round start.
// ---
// Default: "20", Min: "0", Max: "100"
// 
aibo_user_follow_percent "20"

//
// Specifies how many bots can follow a single user.
// ---
// Default: "1", Min: "0", Max: "8"
// 
aibo_user_max_followers "1"

//
// If enabled, all bots will be forced to use only the knife, skipping weapon buying routines.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_jasonmode "0"

//
// Allows bots to use radio or chatter.
//  Allowed values: '0', '1', '2'.
//  If '0', radio and chatter is disabled.
//  If '1', only radio allowed.
//  If '2' chatter and radio allowed.
// ---
// Default: "2", Min: "0", Max: "2"
// 
aibo_radio_mode "2"

//
// Specifies whether bots are able to use team economics, like not buying any weapons for the whole team to keep money for better guns.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_economics_rounds "1"

//
// Allows bots to ignore economics and buy weapons with disrespect to economics.
// ---
// Default: "25", Min: "0", Max: "100"
// 
aibo_economics_disrespect_percent "25"

//
// Allows or disallows the bot to check the environment for darkness, thus allowing or not allowing the use of flashlights or NVG.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_check_darkness "1"

//
// Allows bots to partially avoid grenades.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_avoid_grenades "1"

//
// Allows or disallows bots to take revenge on teamkillers/team attacks.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_tkpunish "1"

//
// If enabled, the bot's think function is disabled, so bots will not move anywhere from their spawn spots.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_freeze_bots "0"

//
// Allows or disallows the use of spray paints.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_spraypaints "30"

//
// Allows or disallows bots weapon buying routines.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_botbuy "1"

//
// Allows bots to destroy breakables around them, even without touching them.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_destroy_breakables_around "1"

//
// The radius within which the bot searches the world for new objects, items, and weapons.
// ---
// Default: "450.0", Min: "64.0", Max: "1024.0"
// 
aibo_object_pickup_radius "450.0"

//
// The radius within which the bot destroys breakables around it, when not touching them.
// ---
// Default: "400.0", Min: "64.0", Max: "1024.0"
// 
aibo_object_destroy_radius "400.0"

//
// Specifies the path for the bot chatter sound files.
// ---
// Default: "sound/radio/bot"
// 
aibo_chatter_path "sound/radio/bot"

//
// Allows or disallows bots to attack monsters.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_attack_monsters "0"

//
// Allows or disallows bots to pick up custom items.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_pickup_custom_items "0"

//
// Allows bots to pick up mod items like ammo, health kits, and suits.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_pickup_ammo_and_kits "0"

//
// Allows or disallows bots to pick up the best weapons.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_pickup_best "1"

//
// Allows or disallows bots to do map objectives, i.e. plant/defuse bombs, and save hostages.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_ignore_objectives "0"

//
// Enables or disables bot chat functionality.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_chat "1"

//
// Bot's chance to send random dead chat when killed.
// ---
// Default: "30", Min: "0", Max: "100"
// 
aibo_chat_percent "30"

//
// Specifies whether bots are able to fire at enemies behind the wall, if they hear or suspect them.
// ---
// Default: "4", Min: "0", Max: "4"
// 
aibo_shoots_thru_walls "4"

//
// Enables or disables searching the world for enemies.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_ignore_enemies "0"

//
// Enables or disables checking enemy rendering flags. Useful for some mods.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_check_enemy_rendering "0"

//
// Enables or disables checking enemy invincibility. Useful for some mods.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_check_enemy_invincibility "0"

//
// Enables or disables the bot's ability to stab the enemy with the knife if the bot is in good condition.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_stab_close_enemies "1"

//
// If enabled, bots are not allowed to press the attack button, thus forbidding them from shooting.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_dont_shoot "0"

//
// Enables or disables bullet spread for bots on servers running without metamod.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_enable_bullet_spread "0"

//
// Uses the engine to check the potential visibility of an enemy.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_use_engine_pvs_check "1"

//
// Uses hitbox-based enemy targeting, instead of offset-based. Use with aibo_use_engine_pvs_check enabled to reduce CPU usage.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_use_hitbox_enemy_targeting "0"

//
// Bots will consider glass when deciding to shoot enemies. Required for very special maps only.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_aim_trace_consider_glass "0"

//
// Binds the specified key for opening the bot menu.
// ---
// Default: "="
// 
aibo_bind_menu_key "="

//
// Specifies a comma separated list of bot cvars that will not be overwritten by the config on changelevel.
// ---
// Default: "aibo_quota,aibo_autovacate"
// 
aibo_ignore_cvars_on_changelevel "aibo_quota,aibo_autovacate"

//
// The value (password) for the setinfo key. If the user sets the correct password, he gains access to bot commands and menus.
// ---
// Default: ""
// 
aibo_password ""

//
// The name of the setinfo key used to store the password for bot commands and menus.
// ---
// Default: "_ybpw"
// 
aibo_password_key "_ybpw"

//
// Allows the use of classic bot kill when issuing the end-round command in menus, instead of the gamedll endround.
// ---
// Default: "0"
// 
aibo_bots_kill_on_endround "0"

//
// Enables or disables CSDM / FFA mode for bots.
//  Allowed values: '0', '1', '2', '3'.
//  If '0', CSDM / FFA mode is auto-detected.
//  If '1', CSDM mode is enabled, but FFA is disabled.
//  If '2', CSDM and FFA mode is enabled.
//  If '3', CSDM and FFA mode is disabled.
// ---
// Default: "0", Min: "0", Max: "3"
// 
aibo_csdm_mode "0"

//
// If enabled, bots will not apply game modes based on map name prefix (fy_ and ka_ specifically).
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_ignore_map_prefix_game_mode "0"

//
// Maximum number of threads the bot will run to process some tasks. -1 means half of the CPU cores are used.
// ---
// Default: "-1", Min: "-1", Max: "128"
// 
aibo_threadpool_workers "-1"

//
// If enabled, bots will not apply throwing conditions on grenades.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_grenadier_mode "0"

//
// Makes bots ignore enemies for a specified time in seconds on a new round. Useful for Zombie Plague mods.
// ---
// Default: "0"
// 
aibo_ignore_enemies_after_spawn_time "0"

//
// Specifies the maximum health of a breakable object that the bot will consider destroying.
// ---
// Default: "500.0", Min: "1.0", Max: "3000.0"
// 
aibo_breakable_health_limit "500.0"

//
// Lower bound for base bot ping shown in the scoreboard upon creation.
// ---
// Default: "5", Min: "0", Max: "100"
// 
aibo_ping_base_min "5"

//
// Upper bound for base bot ping shown in the scoreboard upon creation.
// ---
// Default: "20", Min: "0", Max: "100"
// 
aibo_ping_base_max "20"

//
// Count player pings when calculating the average ping for bots. If not, a random ping is chosen for bots.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_ping_count_real_players "1"

//
// Interval at which the fake ping gets updated in the scoreboard.
// ---
// Default: "1.25", Min: "0.1", Max: "10.0"
// 
aibo_ping_updater_interval "1.25"

//
// Specifies whether the bot should not 'fix' camp directions of camp waypoints when loading the old PWF format.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_graph_fixcamp "0"

//
// Specifies the base URL from which bots download a missing graph. The 'graph/<map>.graph' path is appended automatically. Set to empty to disable downloads.
// Allowed values: "@github", "@russia", "@http", or any full base URL.
// If "@github", CDN raw over https (unavailable on builds without TLS).
// If "@russia", sourcecraft download over https, for regions with github issues (unavailable on builds without TLS).
// If "@http" (or "@legacy"), legacy server over plain http.
// ---
// Default: "@github"
// 
aibo_graph_url "@github"

//
// Specifies the base URL to which bots upload graphs. The file is POSTed to the base URL as-is. Set to empty to disable uploads.
// Allowed values: "@workers", "@russia", "@http", or any full base URL.
// If "@workers", cloudflare worker over https (falls back to "@http" on builds without TLS).
// If "@russia", yandex worker copy over https (falls back to "@http" on builds without TLS).
// If "@http" (or "@legacy"), legacy server over plain http.
// Automatic collection is requested from the server root and requires https, otherwise it's skipped.
// ---
// Default: "@workers"
// 
aibo_graph_url_upload "@workers"

//
// Every N graph nodes placed on the map, the graph will be saved automatically (without checks).
// ---
// Default: "15", Min: "0", Max: "4096"
// 
aibo_graph_auto_save_count "15"

//
// Maximum distance to draw graph nodes from the editor viewport.
// ---
// Default: "400", Min: "64", Max: "3072"
// 
aibo_graph_draw_distance "400"

//
// Allows bots to exchange your graph files with the graph database automatically.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_graph_auto_collect_db "1"

//
// Kicks bots to automatically make room for human players.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_autovacate "1"

//
// How many slots the autovacate feature should keep for human players.
// ---
// Default: "1", Min: "1", Max: "8"
// 
aibo_autovacate_keep_slots "1"

//
// Kicks the bot immediately when a human player joins the server (aibo_autovacate must be enabled).
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_kick_after_player_connect "1"

//
// Specifies the number of bots to be added to the game.
// ---
// FINAL package value: "31"; bounded by available slots and humans.
// 
aibo_quota "31"

//
// Specifies the type of quota.
//  Allowed values: 'normal', 'fill', and 'match'.
//  If 'fill', the server will adjust bots to keep N players in the game, where N is aibo_quota.
//  If 'match', the server will maintain a 1:N ratio of humans to bots, where N is aibo_quota_match.
// ---
// Default: "normal"
// 
aibo_quota_mode "normal"

//
// Number of players to match if aibo_quota_mode is set to 'match'.
// ---
// Default: "0", Min: "0", Max: "32"
// 
aibo_quota_match "0"

//
// Specifies how many times per second the bot code will run.
// NOTE: Has effect only if "UnlockThinkFPS = yes" is set in custom.cfg.
// ---
// Default: "40.0", Min: "10.0", Max: "90.0"
//
aibo_think_fps "40.0"

//
// Specifies the amount of time in seconds after which bots will be killed if no humans are left alive.
// ---
// Default: "0.0", Min: "0.0", Max: "90.0"
// 
aibo_autokill_delay "0.0"

//
// Restart the game if the first human player joins a bot game.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_first_human_restart "0"

//
// Specifies whether bots should join the server only when at least one human player is in the game.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_join_after_player "0"

//
// Forces all bots to join the team specified here.
// ---
// Default: "any"
// 
aibo_join_team "any"

//
// Specifies after how many seconds bots should start to join the game after the changelevel.
// ---
// Default: "5.0", Min: "0.0", Max: "30.0"
// 
aibo_join_delay "5.0"

//
// All bot names will be prefixed with the string specified by this cvar.
// ---
// Default: ""
// 
aibo_name_prefix ""

//
// All bots difficulty level. Changing at runtime will affect already created bots.
// ---
// Default: "3", Min: "0", Max: "4"
// 
aibo_difficulty "3"

//
// Lower bound of random difficulty on bot creation. Only affects newly created bots. -1 means only aibo_difficulty is used.
// ---
// Default: "-1", Min: "-1", Max: "4"
// 
aibo_difficulty_min "-1"

//
// Upper bound of random difficulty on bot creation. Only affects newly created bots. -1 means only aibo_difficulty is used.
// ---
// Default: "-1", Min: "-1", Max: "4"
// 
aibo_difficulty_max "-1"

//
// Allows each bot to balance its own difficulty based on the kd-ratio of the team.
// ---
// Default: "0", Min: "0", Max: "2"
// 
aibo_difficulty_auto "0"

//
// Interval at which bots will balance their difficulty.
// ---
// Default: "30", Min: "30", Max: "240"
// 
aibo_difficulty_auto_balance_interval "30"

//
// Enables or disables displaying bot avatars in front of their names in the scoreboard. Note that currently you can only see avatars of your Steam friends.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_show_avatars "0"

//
// Enables latency display in the scoreboard.
//  Allowed values: '0', '1', '2'.
//  If '0', there is nothing displayed.
//  If '1', there is a 'BOT' is displayed.
//  If '2' fake ping is displayed.
// ---
// Default: "0", Min: "0", Max: "2"; FINAL package overrides this value below.
// 
aibo_show_latency "2"
//
// Allows saving bot data upon changelevel, so bots will be restored after a map change.
//  Allowed values: '0', '1', '2'.
//  If '0', nothing is saved.
//  If '1', only quota is saved.
//  If '2', full bot data is saved.
// ---
// Default: "1", Min: "0", Max: "2"
// 
aibo_save_bots "1"

//
// Specifies the bot's wanted skin for the Terrorist team.
// ---
// Default: "0", Min: "0", Max: "5"
// 
aibo_botskin_t "0"

//
// Specifies the bot's wanted skin for the CT team.
// ---
// Default: "0", Min: "0", Max: "5"
// 
aibo_botskin_ct "0"

//
// Sets the default personality when creating bots with quota management.
//  Allowed values: 'none', 'normal', 'careful', 'rusher'.
//  If 'none' is specified personality chosen randomly.
// ---
// Default: "none"
// 
aibo_preferred_personality "none"

//
// Specifies the language for bot messages and menus.
// ---
// Default: "en"
// 
aibo_language "en"

//
// Randomly disconnects and connects bots, simulating players joining/quitting.
// ---
// Default: "0", Min: "0", Max: "1"; FINAL package overrides this value below.
// 
aibo_rotate_bots "1"

//
// Specifies the minimum amount of seconds a bot stays connected, if rotation is active.
// ---
// Default: "360.0", Min: "120.0", Max: "7200.0"; FINAL package overrides this value below.
// 
aibo_rotate_stay_min "180.0"

//
// Specifies the maximum amount of seconds a bot stays connected, if rotation is active.
// ---
// Default: "3600.0", Min: "1800.0", Max: "14400.0"; FINAL package overrides this value below.
// 
aibo_rotate_stay_max "1800.0"

//
// Specifies a semicolon separated list of weapons that are not allowed to be bought/picked up.
//  The list of weapons for Counter-Strike 1.6:
//  p228 - SIG P228
//  shield - Tactical Shield
//  scout - Steyr Scout
//  hegren - High-Explosive Grenade
//  xm1014 - Benelli XM1014
//  mac10 - Ingram MAC-10
//  aug - Steyr Aug
//  sgren - Smoke Grenade
//  elite - Dual Beretta 96G Elite
//  fn57 - FN Five-Seven
//  ump45 - HK UMP45
//  sg550 - Sig SG-550 Sniper
//  galil - IMI Galil
//  famas - GIAT FAMAS
//  usp - HK USP .45 Tactical
//  glock - Glock18 Select Fire
//  awp - AI Arctic Warfare/Magnum
//  mp5 - HK MP5-Navy
//  m249 - FN M249 Para
//  m3 - Benelli M3 Super90
//  m4a1 - Colt M4A1 Carbine
//  tmp - Steyr Tactical Machine Pistol
//  g3sg1 - HK G3/SG-1 Sniper Rifle
//  flash - Concussion Grenade
//  deagle - Desert Eagle .50AE
//  sg552 - Sig SG-552 Commando
//  ak47 - Automat Kalashnikov AK-47
//  knife - Knife
//  p90 - FN P90
//  vest - Kevlar Vest
//  vesthelm - Kevlar Vest and Helmet
//  defuser - Defuser Kit
//  
// ---
// Default: ""
// 
aibo_restricted_weapons "p228;elite;fiveseven;m3;xm1014;mp5;tmp;p90;mac10;ump45;sg552;galil;famas;aug;scout;g3sg1;sg550;m249;shield"

//
// When enabled, bots will not try to avoid teammates on their way. Assumes that some semiclip plugins are in use.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_has_team_semiclip "0"

//
// Determines the maximum slope height change between the current and next node to consider the current link as a jump link. Only for generated graphs.
// ---
// Default: "18.0", Min: "12.0", Max: "48.0"
// 
aibo_graph_slope_height "18.0"

//
// Selects the heuristic function mode. For debug purposes only.
// ---
// Default: "0", Min: "0", Max: "4"
// 
aibo_path_heuristic_mode "0"

//
// Limits the maximum Floyd-Warshall memory (megabytes). Uses Dijkstra if memory is exceeded.
// ---
// Default: "6", Min: "0", Max: "32"
// 
aibo_path_floyd_memory_limit "6"

//
// Uses simple distance path calculation instead of running a full Dijkstra path cycle. Used only when Floyd matrices are unavailable due to memory limits.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_path_dijkstra_simple_distance "1"

//
// Enables post-smoothing for A*. Reduces zig-zags on paths at the cost of some CPU cycles.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_path_astar_post_smooth "0"

//
// Enables or disables showing a welcome message to the host entity on game start.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_display_welcome_text "1"

//
// Enables or disables fake server query responses, which show bots as real players in the server browser.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_enable_query_hook "0"

//
// Allows or disallows bots to return a fake Steam ID.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_enable_fake_steamids "0"

//
// Affects the bot's vision by smoke clouds.
// ---
// Default: "2", Min: "0", Max: "2"
// 
aibo_smoke_grenade_checks "2"

//
// Radius to check for smoke clouds around a detonated grenade.
// ---
// Default: "240", Min: "32", Max: "320"
// 
aibo_smoke_grenade_radius "240"

//
// Specifies whether bots are able to use 'shift' if they think that an enemy is near.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_walking_allowed "1"

//
// Allows or disallows bots to camp. Doesn't affect bomb/hostage defending tasks.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_camping_allowed "1"

//
// Lower bound of time from which the time for camping is calculated.
// ---
// Default: "15.0", Min: "5.0", Max: "90.0"
// 
aibo_camping_time_min "15.0"

//
// Upper bound of time until which the time for camping is calculated.
// ---
// Default: "45.0", Min: "15.0", Max: "120.0"
// 
aibo_camping_time_max "45.0"

//
// Allows or disallows the ability for random knife attacks when the bot is rushing and no enemy is nearby.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_random_knife_attacks "0"

//
// Maximum number of path nodes to predict the enemy.
// ---
// Default: "22", Min: "15", Max: "256"
// 
aibo_max_nodes_for_predict "22"

//
// Enables or disables extra hard difficulty for bots.
// ---
// Default: "0", Min: "0", Max: "1"
// 
aibo_whose_your_daddy "0"

//
// Specifies the RGB color of the debug overlay text, e.g. '255 255 255'.
// ---
// Default: "255 255 255"
// 
aibo_debug_overlay_color "255 255 255"

//
// Enables or disables display menu text, when players asks for menu. Useful only for Android.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_display_menu_text "1"

//
// Enables classic podbot fun modes for everyone on the server.
//  Allowed values: 'imsober', 'off', 'tronisback', 'itsnewyear', 'imhaunted', 'itstoodark', 'stonedagain',
//  'imonmars'.
// ---
// Default: "imsober"
// 
aibo_fun_mode "imsober"

//
// Allows bots to keep moving while throwing grenades.
// ---
// Default: "-"
// 
aibo_move_during_throw "-"

//
// Penalty weight for sharp turns in pathfinding (0=off, higher=smoother paths).
// ---
// Default: "0.5", Min: "0.0", Max: "2.0"
// 
aibo_path_turn_penalty "0.5"

//
// Allows to completely disable think fps on Xash3D.
// ---
// Default: "1", Min: "0", Max: "1"
// 
aibo_think_fps_disable "1"


